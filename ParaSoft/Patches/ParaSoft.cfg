// ParaSoft Airbraking Technologies - adds the softbody canopy module to every parachute.
//
// One patch per parachute module rather than one with an OR: ModuleManager's HAS[] has
// no OR, and the !MODULE[ModuleParaSoft] guard stops a part that has two of these (a
// RealChute part that still carries a stock module, say) getting the module twice.
//
// LAST[ParaSoft] runs after every FOR and AFTER pass, so RealChute has already turned
// stock chutes into RealChuteModule, and FAR has already turned whatever was left into
// RealChuteFAR, by the time these look. ParaSoft reads whichever module is there.
//
// ParaSoft never changes drag. The parachute module keeps doing all of its own physics;
// this module only simulates and draws the canopy.
//
// To leave a particular part's canopy animated the old way:
//   @PART[myPart]:AFTER[ParaSoft] { @MODULE[ModuleParaSoft] { @simulate = false } }
// (or LAST[zzzMyPatch] if you prefer running after this file).

@PART[*]:HAS[@MODULE[ModuleParachute],!MODULE[ModuleParaSoft]]:LAST[ParaSoft]
{
	MODULE
	{
		name = ModuleParaSoft
	}
}

@PART[*]:HAS[@MODULE[ModuleEvaChute],!MODULE[ModuleParaSoft]]:LAST[ParaSoft]
{
	MODULE
	{
		name = ModuleParaSoft
	}
}

@PART[*]:HAS[@MODULE[RealChuteModule],!MODULE[ModuleParaSoft]]:NEEDS[RealChute]:LAST[ParaSoft]
{
	MODULE
	{
		name = ModuleParaSoft
	}
}

@PART[*]:HAS[@MODULE[RealChuteFAR],!MODULE[ModuleParaSoft]]:NEEDS[FerramAerospaceResearch]:LAST[ParaSoft]
{
	MODULE
	{
		name = ModuleParaSoft
	}
}
