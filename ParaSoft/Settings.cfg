// ParaSoft Airbraking Technologies - modder-level tuning.
//
// Player-facing switches (on/off, quality, collisions, waves, wind, turbulence, EVA
// chutes, how long cut canopies linger) are in the stock settings screen under
// "ParaSoft". These are the physical constants behind them. None of them changes drag:
// the parachute module owns that. They change how the canopy moves and looks.

PARASOFT_SETTINGS
{
	// Fabric mass per square metre, kg. Ripstop nylon is 0.04-0.07. RealChute canopies use
	// their material's own areal density instead (Nylon, Kevlar...).
	arealDensity = 0.05

	// Suspension line mass per metre, kg.
	lineDensity = 0.012

	// Fraction of the ram air the fabric lets through. Lower inflates harder and rounder.
	porosity = 0.08

	// Filling time, in canopy diameters travelled. Real round canopies take 2-8; lower
	// opens faster. The canopy is still never shown more open than the parachute module's
	// own drag says it is.
	fillDistance = 2.5

	// Mass of air the canopy drags along with it, as a multiple of (air density x canopy
	// radius) per square metre of fabric. It is why canopies swing slowly, and it keeps the
	// cloth stable at high dynamic pressure. 0.35 is tuned; 0 is not recommended.
	apparentMass = 0.35

	// Multiplier on fabric and line stiffness.
	stiffness = 1

	// Speed the pack leaves the part at, m/s - a mortar or spring, before the pilot chute
	// takes over.
	ejectSpeed = 12

	// Solver substeps per second of game time. 200 is four per physics frame.
	substepsPerSecond = 200

	// Beyond this many metres from the camera a canopy steps at half rate; beyond the
	// second it is paused until the camera comes back.
	lodDistance = 600
	freezeDistance = 2500

	// Most canopies simulated at once. A cluster counts one per canopy. Any more deploy
	// with their parachute module's own animation.
	maxCanopies = 24

	// Canopy models with more vertices than this are left to their own animation.
	maxVertices = 40000

	// Log every deployment and canopy fit to KSP.log.
	verboseLogging = false
}
