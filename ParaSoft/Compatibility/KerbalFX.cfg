// KerbalFX compatibility.
//
// AeroFX anchors its aerodynamic ribbons to the extremities of parts. A parachute part's
// canopy is drawn by ParaSoft as its own object and the part's original canopy mesh is
// hidden but still there, swinging wherever the parachute module points it - so ribbons
// anchored to "the far end of a chute" trail from nowhere in particular. Keeping parachute
// parts out of the ribbon anchors avoids that; nothing else on the craft is affected.
//
// KerbalFX matches `match` as a case-insensitive substring of the part name, which covers
// stock, ReStock, RealChute and most mod parachute parts. ImpactPuffs, RoverDust and
// BlastFX need nothing: they react to parts and engines, and canopies are neither.

@KERBALFX_AERO_FX:NEEDS[KerbalFX]
{
	PART_IGNORE
	{
		match = chute
	}
	PART_IGNORE
	{
		match = drogue
	}
}
